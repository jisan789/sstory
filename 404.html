<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেজটি পাওয়া যায়নি - গল্প সংকলন</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Anek Bangla', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }
        .code {
            font-size: 4.5rem;
            font-weight: 800;
            color: #991b1b;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            background: #334155;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">৪০৪</div>
        <h1>পেজটি খুঁজে পাওয়া যায়নি</h1>
        <p>আপনি যে পাতাটি খুঁজছেন তা হয়তো সরানো হয়েছে অথবা লিংকটি সঠিক নয়।</p>
        <a href="/" class="home-btn">
            মূল পাতায় ফিরে যান
        </a>
    </div>
</body>
</html>
